[package]
description = "Standard library for Osmosis with CosmWasm support included"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "osmosis-std"
repository = "https://github.com/osmosis-labs/osmosis-rust/"
version = "0.26.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]

[dependencies]
chrono = {version = "0.4.27", default-features = false}
cosmwasm-std = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp", features = ["stargate"] }
osmosis-std-derive = { git = "https://github.com/permissionlessweb/osmosis-rust", branch = "zk-mvp" }
prost = {version = "0.14.1", default-features = false, features = ["derive"]}
prost-types = {version = "0.14.1", default-features = false}
cw-schema = { git = "https://github.com/permissionlessweb/cosmwasm", branch = "zk-mvp", default-features = false }
schemars = "0.8"

# for query
serde = {version = "1.0", default-features = false, features = ["derive"]}
serde-cw-value = "0.7.0"
