[package]
authors = ["Supanat Potiwarakorn <supanat.ptk@gmail.com>"]
edition = "2021"
name = "osmosis-std-cosmwasm-test"
version = "0.2.0"

exclude = [
  # Those files are rust-optimizer artifacts. You might want to commit them for convenience but they should not be part of the source code publication.
  "contract.wasm",
  "hash.txt",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = true
panic = 'abort'
rpath = false

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[package.metadata.scripts]
optimize = """docker run --rm -v "$(pwd)":/code \
  --mount type=volume,source="$(basename "$(pwd)")_cache",target=/code/target \
  --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
  cosmwasm/rust-optimizer:0.17.0
"""

[dependencies]
cosmwasm-schema = { path = "../../../ZK/cw/zk-cosmwasm/packages/schema" }
cosmwasm-std = { path = "../../../ZK/cw/zk-cosmwasm/packages/std" }
cw-storage-plus = { path = "../../../ZK/cw/zk-storage-plus" }
cw2 = { path = "../../../ZK/cw/zk-cw-minus/packages/cw2" }
jsonformat = "2.0.0"
osmosis-std = { path = "../../packages/osmosis-std" }
schemars = "0.8"
serde = { version = "1.0.137", default-features = false, features = ["derive"] }
thiserror = { version = "1.0.31" }

[dev-dependencies]
cw-multi-test = { path = "../../../cw-multi-test-fork" }
prost = "0.14.1"
serde_json = "1.0.85"
osmosis-test-tube = { path = "../../../osmosis-test-tube/packages/osmosis-test-tube" }
